name: AI daily improvement
on:
  schedule:
    - cron: '20 22 * * *'  # 07:20 KST every day (UTC 22:20 previous day)
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ai-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Train and validate
        env:
          ASOS_SERVICE_KEY: ${{ secrets.ASOS_SERVICE_KEY }}
        run: python auto_train.py
      - name: Record forecasts and score completed days
        run: python daily_monitor.py
      - name: Commit approved model and observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/direct_model.joblib artifacts/manifest.json data/asos_143.csv data/prediction_history.csv
          if ! git diff --cached --quiet; then
            git commit -m 'Update ASOS data and validated AI model'
            git push
          fi
